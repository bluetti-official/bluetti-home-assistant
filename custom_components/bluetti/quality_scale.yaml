rules:
  # Bronze
  action-setup:
    status: exempt
    comment: >-
      No custom service actions are registered; only standard entity
      services (turn_on/turn_off/select_option) are used, which Home
      Assistant handles natively.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: No custom service actions are provided by this integration.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: Cloud-based integration; there is no local network discovery protocol to update from.
  discovery:
    status: exempt
    comment: Cloud-based integration authenticated via OAuth2; devices cannot be discovered on the local network.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: >-
      The entity set is small and deliberate; every entity is a primary
      measurement or control, not diagnostic noise, so none warrant being
      disabled by default.
  entity-translations:
    status: exempt
    comment: >-
      Entity names are provided dynamically by the BLUETTI cloud API per
      device/firmware (fnName), not static strings known at development
      time, so a translation_key cannot be used.
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices: done

  # Platinum
  async-dependency: todo
  inject-websession: done
  strict-typing: todo
